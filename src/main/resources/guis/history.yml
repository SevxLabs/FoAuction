# Sold history GUI. Slots are 0-based Minecraft inventory slots.
title: "History"
content-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
items:
  previous:
    slot: 45
    name: "#ffffff← Previous Page"
    lore:
      - "#ffffffPage {page}/{max_page}"
  back:
    slot: 49
    name: "#ffd966← Back"
    lore:
      - "#ffffffClick to return to the previous menu."
  next:
    slot: 53
    name: "#ffffff→ Next Page"
    lore:
      - "#ffffffPage {page}/{max_page}"
  empty:
    slot: 4
    material: PAPER
    name: "{muted}ɴᴏ ʜɪꜱᴛᴏʀʏ ʏᴇᴛ"
    lore:
      - "{white}No sold listings were found"

# Text appended to sold-history entries. The original item name/lore stays untouched.
entry-lore:
  separator: ""
  seller: "{muted}Seller: {theme}{seller}"
  buyer: "{muted}Buyer: {theme}{buyer}"
  price: "{muted}Price: {theme}{price}"
  sold: "{muted}Sold: {theme}{sold}"
