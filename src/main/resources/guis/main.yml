# Main auction browser GUI. Slots are 0-based Minecraft inventory slots.
title: "Auction House"
content-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]

# Lore added under every auction item in the main listing view.
# Change labels like "Price:" to "Each:" here if that wording fits your server.
listing-lore:
  details:
    - ""
    - "{muted}Seller: {theme}{seller}"
    - "{muted}Price: {theme}{price}"
    - "{muted}Time Left: {theme}{time_left}"
  action-separator: ""
  buy-actions:
    - "{theme}Click to buy"
  container-actions:
    - "{theme}Left Click to buy"
    - "{theme}Right Click to preview"
  owner-actions:
    - "{theme}Click to cancel"
  admin-actions:
    - "{muted}Press Drop Key: {theme}Admin remove options"

items:
  previous:
    slot: 45
    # Optional public-GUI text override. Defaults match FoPluginCore.
    name: "#ffffff← Previous Page"
    lore:
      - "#ffffffPage {page}/{max_page}"
  claims:
    slot: 46
    material: CHEST
    name: "{theme}ᴄʟᴀɪᴍꜱ"
    lore:
      - "{white}Open your claim box"
  sort:
    slot: 47
    material: HOPPER
    name: "{theme}ꜱᴏʀᴛ"
    # Labels only. FoPluginCore keeps the colors and selection markers fixed.
    lore-options:
      - "Highest Price"
      - "Lowest Price"
      - "Most Recent"
      - "Least Recent"
  filter:
    slot: 48
    material: REDSTONE
    name: "{theme}ꜰɪʟᴛᴇʀ"
    # Labels only. FoPluginCore keeps the colors and selection markers fixed.
    lore-options:
      - "All"
      - "Weapons"
      - "Armor"
      - "Tools"
      - "Blocks"
      - "Food"
      - "Farm"
      - "Redstone"
      - "Potions"
      - "Misc"
  refresh:
    slot: 49
    material: MAP
    name: "{theme}ʀᴇꜰʀᴇꜱʜ"
    lore:
      - "{white}Reload listings"
  manage:
    slot: 50
    material: CHEST
    name: "{theme}ᴍᴀɴᴀɢᴇ ᴀᴜᴄᴛɪᴏɴꜱ"
    lore:
      - "{white}View all your active auctions"
      - "{white}Click any listing to cancel"
  search:
    slot: 51
    # Optional public-GUI text override. Defaults match FoPluginCore.
    name: "#ffd966🔍 Search"
    lore:
      - "#ffffffCurrent: {current}"
      - "#ffffffClick to set filter."
  history-or-clear:
    slot: 52
  history:
    # Used when history viewing is enabled.
    name: "{theme}ʜɪꜱᴛᴏʀʏ"
    lore:
      - "{white}Click to see your history of sold auctions"
  clear-search:
    # Used when history viewing is disabled. Defaults match FoPluginCore.
    name: "#5ec8ffClear Search"
    lore:
      - "#ffffffShow all {target}."
  next:
    slot: 53
    # Optional public-GUI text override. Defaults match FoPluginCore.
    name: "#ffffff→ Next Page"
    lore:
      - "#ffffffPage {page}/{max_page}"
