# Seller listing browser GUI. Slots are 0-based Minecraft inventory slots.
title: "Viewing"
content-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
items:
  previous:
    slot: 45
    name: "#ffffff← Previous Page"
    lore:
      - "#ffffffPage {page}/{max_page}"
  back:
    slot: 49
    name: "#ffd966← Back"
    lore:
      - "#ffffffClick to return to the previous menu."
  sort:
    slot: 47
    material: HOPPER
    name: "{theme}ꜱᴏʀᴛ"
    # Labels only. FoPluginCore keeps the colors and selection markers fixed.
    lore-options:
      - "Highest Price"
      - "Lowest Price"
      - "Most Recent"
      - "Least Recent"
  refresh:
    slot: 48
    material: MAP
    name: "{theme}ʀᴇꜰʀᴇꜱʜ"
    lore:
      - "{white}Reload seller listings"
  next:
    slot: 53
    name: "#ffffff→ Next Page"
    lore:
      - "#ffffffPage {page}/{max_page}"
